name: Command-Based Approach

on:
  push:
    branches: [ feature/action-wrapping ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # Required for JWT (Sigstore)

jobs:
  command-based-approach:
    name: Command-Based Approach
    runs-on: ubuntu-latest
    steps:
      # Regular checkout
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      # Setup Go directly
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      
      # Install GoReleaser directly
      - name: Install GoReleaser
        run: go install github.com/goreleaser/goreleaser@latest

      # Use witness-run-action to wrap command (known working approach)
      - name: Run with Witness Command
        uses: testifysec/witness-run-action@feature/action-wrapping
        with:
          step: "goreleaser-command"
          command: "goreleaser release --snapshot --clean"
          enable-sigstore: true
          enable-archivista: true
          attestations: "environment github slsa"
name: GoReleaser Action Ref Example

on:
  push:
    branches: [ feature/action-wrapping ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # Required for JWT (Sigstore)

jobs:
  goreleaser-action-wrapping:
    name: GoReleaser Action Ref
    runs-on: ubuntu-latest
    steps:
      # Regular checkout - needed first
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      # Setup Go directly - needed for goreleaser
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      
      # Use witness-run-action to wrap goreleaser action (using action-ref)
      # NOTE: This approach currently has issues with boolean parameters
      - name: GoReleaser with Action Ref
        uses: testifysec/witness-run-action@feature/action-wrapping
        with:
          step: "goreleaser"
          action-ref: "goreleaser/goreleaser-action@v5"
          # Pass boolean values as strings to avoid YAML parsing issues
          version: latest
          args: "release --snapshot --clean"
          # Important: using direct parameter names, not the input- prefix
          # This is a workaround until the witness-run-action properly supports input prefixing
          enable-sigstore: true
          enable-archivista: true
          attestations: "environment github slsa"
          witness-install-dir: "./"
          archivista-server: "https://archivista.testifysec.io"
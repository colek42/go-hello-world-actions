name: Build and Test

on:
  push:
    branches: [ main, feature/action-wrapping ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  id-token: write  # Required for JWT (Sigstore)

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      # Regular checkout - needed first
      - name: Checkout
        uses: actions/checkout@v4
      
      # Setup Go directly
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      
      # Run Go tests with witness-run-action wrapper (Command-line action)
      - name: Run Tests with Witness
        uses: testifysec/witness-run-action@feature/action-wrapping
        with:
          step: "run-tests"
          command: "go test -v ./..."
          enable-sigstore: true
          attestations: "environment github"
  
  build:
    name: Build with GoReleaser
    runs-on: ubuntu-latest
    needs: test
    steps:
      # Regular checkout
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      # Setup Go directly
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      
      # Run GoReleaser with witness-run-action wrapper (Command-line action)
      - name: Run GoReleaser with Witness
        uses: testifysec/witness-run-action@feature/action-wrapping
        with:
          step: "goreleaser"
          command: "go install github.com/goreleaser/goreleaser@latest && goreleaser release --snapshot --clean"
          enable-sigstore: true
          enable-archivista: true
          attestations: "environment github slsa"
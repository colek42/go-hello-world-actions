name: GoReleaser Direct (No Wrapping)

on:
  push:
    branches: [ feature/action-wrapping ]
  workflow_dispatch:

permissions:
  contents: write # Needed for goreleaser to create releases
  id-token: write # Needed for Sigstore/witness

jobs:
  goreleaser:
    name: GoReleaser (Unwrapped)
    runs-on: ubuntu-latest
    steps:
      # Regular checkout 
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      # Setup Go
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      
      # Run GoReleaser directly without wrapping
      - name: GoReleaser Direct
        uses: goreleaser/goreleaser-action@v5
        with:
          version: latest
          args: release --snapshot --clean
          install-only: false
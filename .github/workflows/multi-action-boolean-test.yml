name: Multi-Action Boolean Test

on:
  push:
    branches: [ fix/boolean-input-handling, feature/action-wrapping ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # Required for JWT (Sigstore)

jobs:
  test-boolean-with-multiple-actions:
    name: Test Boolean Handling Across Different Actions
    runs-on: ubuntu-latest
    steps:
      # Regular checkout
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      # Test with setup-go action (debug boolean)
      - name: Test 1 - setup-go with debug=true
        uses: testifysec/witness-run-action@b4a0ee61aeec62219b01c8fbda3152eeed105c29
        with:
          step: "setup-go-debug-true"
          action-ref: "actions/setup-go@v5"
          input-go-version: "1.22"
          input-debug: "TRUE"  # Using uppercase format
          enable-sigstore: true
          attestations: "environment github"
          witness-install-dir: "./"
      
      # Test with checkout action (persist-credentials boolean)
      - name: Test 2 - checkout with persist-credentials=false
        uses: testifysec/witness-run-action@b4a0ee61aeec62219b01c8fbda3152eeed105c29
        with:
          step: "checkout-persist-creds-false"
          action-ref: "actions/checkout@v4"
          input-persist-credentials: "FALSE"  # Using uppercase format
          input-fetch-depth: "1"
          enable-sigstore: true
          attestations: "environment github"
          witness-install-dir: "./"
      
      # Test with cache action (restore-keys boolean)
      - name: Test 3 - cache with skip-restore=true
        uses: testifysec/witness-run-action@b4a0ee61aeec62219b01c8fbda3152eeed105c29
        with:
          step: "cache-skip-restore-true"
          action-ref: "actions/cache@v4"
          input-path: "./go/pkg/mod"
          input-key: "go-mod-${{ hashFiles('**/go.sum') }}"
          input-skip-restore: "TRUE"  # Using uppercase format
          enable-sigstore: true
          attestations: "environment github"
          witness-install-dir: "./"
name: Action Wrapping Examples

on:
  push:
    branches: [ feature/action-wrapping ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # Required for JWT (Sigstore)

jobs:
  javascript-action-wrapping:
    name: JavaScript Action Wrapping
    runs-on: ubuntu-latest
    steps:
      # Regular checkout for initial setup
      - name: Initial Checkout
        uses: actions/checkout@v4

      # JavaScript Action wrapping with witness-run-action
      - name: Echo with Witness
        uses: testifysec/witness-run-action@feature/action-wrapping
        with:
          step: "simple-echo"
          command: "echo 'This is a simple echo command wrapped with witness'"
          enable-sigstore: true
          attestations: "environment github"
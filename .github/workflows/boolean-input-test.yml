name: Boolean Input Test

on:
  push:
    branches: [ feature/action-wrapping ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # Required for JWT (Sigstore)

jobs:
  boolean-input-test:
    name: Test Boolean Input Handling
    runs-on: ubuntu-latest
    steps:
      # Regular checkout - needed first
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      # Setup Go directly
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      
      # Use witness-run-action with our enhanced boolean parameter fix
      - name: GoReleaser with Witness (Boolean Test) - Using Direct Parameters
        uses: testifysec/witness-run-action@b4a0ee61aeec62219b01c8fbda3152eeed105c29
        with:
          step: "goreleaser"
          action-ref: "goreleaser/goreleaser-action@v5"
          # Using RECOMMENDED approach - direct parameters for booleans
          # These parameters will be passed directly to the GoReleaser action
          # Note: With witness-run-action, we specify them without the input- prefix
          distribution: goreleaser
          version: latest
          args: "--snapshot --clean"
          install-only: true  # Direct parameter without input- prefix (recommended for booleans)
          enable-sigstore: true
          enable-archivista: true
          attestations: "environment github slsa"
          witness-install-dir: "./"
          archivista-server: "https://archivista.testifysec.io"
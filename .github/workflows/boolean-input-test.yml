name: Boolean Input Test

on:
  push:
    branches: [ feature/action-wrapping ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # Required for JWT (Sigstore)

jobs:
  boolean-input-test:
    name: Test Boolean Input Handling
    runs-on: ubuntu-latest
    steps:
      # Regular checkout - needed first
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      # Setup Go directly
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      
      # Use witness-run-action with our enhanced boolean parameter fix
      - name: GoReleaser with Witness (Boolean Test)
        uses: testifysec/witness-run-action@fix/boolean-input-handling
        with:
          step: "goreleaser"
          action-ref: "goreleaser/goreleaser-action@v5"
          # Using enhanced boolean handling with TRUE/FALSE uppercase format
          input-version: latest
          input-args: "release --snapshot --clean"
          input-install-only: "FALSE"  # Using uppercase for YAML schema compliance
          enable-sigstore: true
          enable-archivista: true
          attestations: "environment github slsa"
          witness-install-dir: "./"
          archivista-server: "https://archivista.testifysec.io"
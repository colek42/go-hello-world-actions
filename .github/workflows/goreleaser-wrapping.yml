name: GoReleaser Action Wrapping

on:
  push:
    branches: [ feature/action-wrapping ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # Required for JWT (Sigstore)

jobs:
  goreleaser-action-wrapping:
    name: GoReleaser Action Wrapping
    runs-on: ubuntu-latest
    steps:
      # Regular checkout - needed first
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      # Setup Go directly
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      
      # Use witness-run-action to wrap goreleaser action (using action-ref)
      - name: GoReleaser with Witness
        uses: testifysec/witness-run-action@feature/action-wrapping
        with:
          step: "goreleaser"
          action-ref: "goreleaser/goreleaser-action@v5"
          # Inputs for goreleaser action
          input-version: latest
          input-args: release --snapshot --clean
          input-install-only: "false"  # String format to avoid YAML parsing issues
          enable-sigstore: true
          enable-archivista: true
          attestations: "environment github slsa"
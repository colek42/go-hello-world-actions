name: Fixed Boolean Parameter Handling Example

on:
  push:
    branches:
      - '*'

jobs:
  test-boolean-parameters:
    runs-on: ubuntu-latest
    name: Test Boolean Parameter Handling
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Example 1: Using direct parameters (recommended approach)
      - name: Run GoReleaser with Direct Boolean Parameter
        id: direct-boolean
        uses: testifysec/witness-run-action@a8241420d453b7dc234a266d5f67fb4d02b41d27
        with:
          step: direct-boolean-test
          action-ref: goreleaser/goreleaser-action@v5
          install-only: true
          distribution: goreleaser
          version: latest
          args: --snapshot --clean
          workdir: examples/go-project
          enable-archivista: true
          enable-sigstore: true
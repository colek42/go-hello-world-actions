name: Fixed Boolean Parameter Handling Example

on:
  workflow_dispatch:

jobs:
  test-boolean-parameters:
    runs-on: ubuntu-latest
    name: Test Boolean Parameter Handling
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Example 1: Using direct parameters (recommended approach)
      - name: Run GoReleaser with Direct Boolean Parameter
        uses: testifysec/witness-run-action@v1
        with:
          action-ref: goreleaser/goreleaser-action@v5
          install-only: true
          distribution: goreleaser
          version: latest
          args: --snapshot --clean
          workdir: examples/go-project

      # Example 2: Using input- prefixed parameters (not recommended for booleans)
      - name: Run GoReleaser with Input-Prefixed Boolean Parameter
        uses: testifysec/witness-run-action@v1
        with:
          action-ref: goreleaser/goreleaser-action@v5
          input-install-only: true
          input-distribution: goreleaser
          input-version: latest
          input-args: --snapshot --clean
          input-workdir: examples/go-project

      # Example 3: Multiple boolean parameters using direct approach
      - name: Run with Multiple Boolean Parameters
        uses: testifysec/witness-run-action@v1
        with:
          action-ref: example/action@v1
          parameter1: true
          parameter2: false
          parameter3: "string value"
          
      # Example 4: Multiple boolean parameters using input- prefix (not recommended)
      - name: Run with Multiple Input-Prefixed Boolean Parameters
        uses: testifysec/witness-run-action@v1
        with:
          action-ref: example/action@v1
          input-parameter1: true
          input-parameter2: false
          input-parameter3: "string value"